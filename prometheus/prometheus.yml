global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'web'
    static_configs:
      - targets: ['web:8000']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
    # Use postgres_exporter (would need to add it)

  - job_name: 'celery'
    static_configs:
      - targets: ['celery:']  # Celery worker metrics port

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
