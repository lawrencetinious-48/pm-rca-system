[pytest]
pythonpath = .
python_files = test_*.py
testpaths = tests
addopts = -q --tb=short --timeout=30 --timeout-method=thread
timeout_func_only = true
junit_family = xunit2
filterwarnings = error::sqlalchemy.exc.LegacyAPIWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
