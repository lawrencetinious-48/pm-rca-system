version: "3.9"

services:
  web:
    ports: []
    expose:
      - "8000"
    environment:
      SESSION_COOKIE_SECURE: "1"
      REMEMBER_COOKIE_SECURE: "1"
      SESSION_COOKIE_SAMESITE: "Lax"
      SESSION_COOKIE_HTTPONLY: "1"
      REMEMBER_COOKIE_SAMESITE: "Lax"
      REMEMBER_COOKIE_HTTPONLY: "1"
      PREFERRED_URL_SCHEME: "https"
      PUBLIC_BASE_URL: https://${SERVER_NAME:-localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./logs/caddy:/var/log/caddy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  caddy-data:
  caddy-config: