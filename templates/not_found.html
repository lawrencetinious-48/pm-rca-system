{% extends 'layout.html' %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="error-page-icon mb-4">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
      </div>
      <h1 class="display-1 fw-bold text-muted">404</h1>
      <h2 class="mb-3">Page not found</h2>
      <p class="lead mb-4">Sorry, we couldn’t find the page you’re looking for.</p>
      <p class="text-muted mb-4">The link may be broken, or the page may have been moved or deleted.</p>
      <div class="d-flex flex-wrap gap-3 justify-content-center">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg px-4">
          <i class="bi bi-house-door-fill me-2"></i>Go to Dashboard
        </a>
        <button onclick="window.history.back()" class="btn btn-outline-secondary btn-lg px-4">
          <i class="bi bi-arrow-left me-2"></i>Go Back
        </button>
      </div>
      <hr class="my-4">
      <p class="small text-muted">
        If you believe this is an error, please <a href="{{ url_for('notifications') }}">contact support</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
