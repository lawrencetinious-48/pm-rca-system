version: "3.9"

services:
  web:
    # Override the image's CMD: use Flask dev server instead of Gunicorn
    command: >
      flask run
      --host=0.0.0.0
      --port=8000
      --debug
      --reload
      --extra-files /app/templates
    # Mount your live code (overrides the COPY from Dockerfile)
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      FLASK_DEBUG: "1"
      TEMPLATES_AUTO_RELOAD: "1"
      APP_ENV: development
      # Disable HTTPS & secure cookies for local testing
      SESSION_COOKIE_SECURE: "0"
      REMEMBER_COOKIE_SECURE: "0"
      SESSION_COOKIE_SAMESITE: "Lax"
      SESSION_COOKIE_HTTPONLY: "1"
      REMEMBER_COOKIE_SAMESITE: "Lax"
      REMEMBER_COOKIE_HTTPONLY: "1"
      PREFERRED_URL_SCHEME: "http"
    # (Optional) If you want to bypass Caddy and hit Flask directly
    ports:
      - "5001:8000"
