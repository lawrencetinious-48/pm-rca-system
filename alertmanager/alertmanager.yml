global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${ALERT_EMAIL_ADDRESS}'
  smtp_auth_username: '${ALERT_EMAIL_ADDRESS}'
  smtp_auth_password: '${ALERT_EMAIL_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'email-critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'email-warnings'
      repeat_interval: 4h

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: 'lawrencemulindwa48@gmail.com'
        send_resolved: true
        headers:
          subject: '[PM System] {{ .GroupLabels.alertname }} - {{ .CommonLabels.severity | upper }}'
        html: |
          <h2>PM System Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Instance:</strong> {{ .CommonLabels.instance }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Starts At:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}</p>

  - name: 'email-critical'
    email_configs:
      - to: 'lawrencemulindwa48@gmail.com'
        send_resolved: true
        headers:
          subject: '[CRITICAL] PM System Alert - {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">CRITICAL ALERT</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Instance:</strong> {{ .CommonLabels.instance }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>

  - name: 'email-warnings'
    email_configs:
      - to: 'lawrencemulindwa48@gmail.com'
        send_resolved: true
        headers:
          subject: '[WARNING] PM System - {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']
