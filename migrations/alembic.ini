# Alembic configuration for the PM/RCA system.
# Supports SQLite (development) and PostgreSQL (production).

[alembic]
# Path to the migration scripts (relative to this file)
script_location = migrations

# Template used when generating new migration files.
# Available variables: rev (revision), slug (from message)
file_template = %%(rev)s_%%(slug)s

# Prepend the migration directory with the current revision.
# timezone = UTC

# Run the environment during 'revision' even when autogenerate is disabled.
revision_environment = false

# Compare type and server default when autogenerating migrations (PostgreSQL aware).
compare_type = true
compare_server_default = true

# SQLAlchemy URL will be read from the Flask app config, so we leave it empty here.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root, sqlalchemy, alembic, flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S